apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heatwave-ingress
  namespace: heatwave-ews
spec:
  rules:
    - host: heatwave.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heatwave-frontend
                port: { number: 80 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: heatwave-backend
                port: { number: 8000 }
