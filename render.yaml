services:
  - type: web
    name: heatwave-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements/base.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: postgresql://heatwave:heatwave@localhost:5432/heatwave
      - key: ENVIRONMENT
        value: production