apiVersion: apps/v1
kind: Deployment
metadata:
  name: heatwave-backend
  namespace: heatwave-ews
spec:
  replicas: 2
  selector:
    matchLabels: { app: heatwave-backend }
  template:
    metadata:
      labels: { app: heatwave-backend }
    spec:
      containers:
        - name: backend
          image: heatwave-backend:latest
          ports: [{ containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-secret, key: url }
