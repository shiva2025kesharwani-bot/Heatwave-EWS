apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: heatwave-ews
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_PASSWORD
              value: heatwave
